<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Hunt — Learn JS by Squashing Bugs</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <span>Bug <b id="bugNum">1</b>/5</span>
      <span id="hearts">❤️❤️❤️</span>
      <span>👤 <b id="player">—</b></span>
      <span>XP <b id="xp">0</b></span>
    </header>

    <section class="monster-card">
      <div class="monster" id="monsterEmoji">🐛</div>
      <h2 id="monsterName">Loading…</h2>
      <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
      <p class="hp-text"><span id="hpText">30</span> / 30 HP</p>
    </section>

    <h1 id="title"></h1>
    <p id="prompt"></p>

    <div class="editor">
      <div class="editor-bar">
        <span>🐞 bug.js</span>
        <span class="line-count" id="lineCount">1 line</span>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>

    <div class="buttons">
      <button id="check">⚔️ Attack with fix</button>
      <button id="hint" class="ghost">💡 Hint</button>
      <button id="next" class="hidden">Next bug →</button>
    </div>

    <p id="feedback"></p>

    <section class="leaderboard">
      <h2>🏆 Leaderboard</h2>
      <ol id="leaderboardList"><li>Loading…</li></ol>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
